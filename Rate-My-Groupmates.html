<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg: #f6f7f2;
            --ink: #202921;
            --muted: #737a70;
            --green: #285c3d;
            --lime: #d3ef86;
            --line: #e0e4da
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px 'DM Sans', sans-serif
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button,
        a,
        input,
        select,
        textarea {
            outline-offset: 4px
        }

        button {
            cursor: pointer
        }

        button {
            border: 0
        }

        h1,
        h2,
        h3,
        .brand {
            font-family: 'Space Grotesk', sans-serif
        }

        h1 {
            font-size: 54px;
            line-height: 1.08;
            letter-spacing: -2.5px;
            margin: 15px 0
        }

        h2 {
            font-size: 28px;
            letter-spacing: -1px
        }

        h3 {
            margin: 0 0 8px
        }

        p {
            line-height: 1.65
        }

        .muted {
            color: var(--muted)
        }

        header {
            height: 86px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            gap: 20px;
            background: #fff
        }

        .brand {
            font-size: 22px;
            letter-spacing: -.8px;
            font-weight: 700;
            display: flex;
            gap: 10px;
            align-items: center
        }

        .logo {
            background: var(--green);
            color: var(--lime);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center
        }

        .nav {
            display: flex;
            gap: 16px;
            align-items: center
        }

        .nav button {
            background: none;
            color: var(--muted);
            padding: 8px
        }

        .nav button.active {
            color: var(--green);
            font-weight: 700
        }

        .pill {
            background: #edf2e8;
            padding: 7px 12px;
            border-radius: 30px;
            font-size: 12px
        }

        .btn {
            border-radius: 9px;
            padding: 13px 20px;
            background: var(--green);
            color: white;
            font-weight: 600
        }

        .btn.light {
            background: #edf1e7;
            color: var(--ink)
        }

        .btn.outline {
            background: white;
            border: 1px solid var(--line);
            color: var(--ink)
        }

        main {
            max-width: 1220px;
            margin: auto;
            padding: 38px 28px
        }

        .hero {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 40px;
            padding: 28px 0 42px;
            align-items: center
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            font-weight: 700;
            color: var(--green)
        }

        .hero p {
            font-size: 17px;
            max-width: 480px;
            color: var(--muted)
        }

        .art {
            height: 240px;
            position: relative;
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse, #e5edce 0, transparent 68%)
        }

        .floatcard {
            background: #fff;
            border: 1px solid var(--line);
            box-shadow: 0 16px 40px #25341a0d;
            transform: rotate(-6deg);
            border-radius: 16px;
            padding: 25px;
            width: 270px
        }

        .floatcard .stamp {
            position: absolute;
            right: -24px;
            top: -20px;
            background: var(--lime);
            border: 5px solid var(--bg);
            border-radius: 50%;
            width: 82px;
            height: 82px;
            display: grid;
            place-items: center;
            font-size: 36px
        }

        .avatar {
            display: grid;
            place-items: center;
            border-radius: 16px;
            font-size: 24px;
            width: 60px;
            height: 60px;
            background: #ece5dc;
            color: #695141;
            font-family: 'Space Grotesk';
            font-weight: 600
        }

        .smallavatar {
            width: 35px;
            height: 35px;
            font-size: 12px;
            border-radius: 50%
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .between {
            justify-content: space-between
        }

        .stars {
            color: #bf8825;
            letter-spacing: 2px
        }

        .mini {
            font-size: 12px
        }

        .searchbar {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            gap: 12px
        }

        .searchbar input {
            flex: 1;
            border: 0;
            padding: 10px;
            min-width: 80px;
            background: transparent
        }

        .searchbar select {
            border: 0;
            background: #f4f5ef;
            border-radius: 8px;
            padding: 12px;
            max-width: 210px
        }

        .sectionhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 32px 0 22px
        }

        .sectionhead h2 {
            margin: 0
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px
        }

        .card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 24px;
            transition: .2s
        }

        .card:hover {
            border-color: #aabf9c;
            box-shadow: 0 6px 18px #24301908
        }

        .card h3 {
            font-size: 19px
        }

        .tag {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px
        }

        .score {
            font-size: 29px;
            font-weight: 700;
            font-family: 'Space Grotesk';
            letter-spacing: -1px
        }

        .score small {
            font-size: 13px;
            color: var(--muted);
            font-weight: 400;
            letter-spacing: 0
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 19px 0
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .chip {
            border-radius: 7px;
            background: #f3f5ec;
            padding: 7px 9px;
            font-size: 11px
        }

        .cardfooter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px
        }

        .textbtn {
            background: none;
            color: var(--green);
            font-weight: 700;
            padding: 4px
        }

        .bottom {
            margin: 36px 0;
            background: #eaf0dd;
            border-radius: 12px;
            padding: 23px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px
        }

        .bottom p {
            margin: 4px 0 0;
            font-size: 13px
        }

        .footer {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--line);
            padding: 25px 0;
            color: var(--muted);
            font-size: 12px
        }

        .back {
            margin-bottom: 24px
        }

        .profilegrid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px
        }

        .profiletop {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 15px;
            padding: 30px
        }

        .profiletop h1 {
            font-size: 35px;
            letter-spacing: -1px
        }

        .review {
            margin-top: 15px;
            background: white;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 22px
        }

        .review p {
            margin: 15px 0
        }

        .badgecard {
            margin-bottom: 12px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 13px
        }

        .badgeicon {
            background: #edf3dc;
            border-radius: 10px;
            font-size: 25px;
            padding: 12px
        }

        .locked {
            opacity: .48
        }

        .modalback {
            position: fixed;
            inset: 0;
            background: #19261db0;
            backdrop-filter: blur(5px);
            display: grid;
            place-items: center;
            z-index: 20;
            padding: 20px
        }

        .modal {
            background: var(--bg);
            width: 520px;
            max-width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 30px;
            border-radius: 17px
        }

        .modal h2 {
            margin: 8px 0
        }

        .close {
            background: #e9ece3;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            float: right
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 20px 0 8px
        }

        input.field,
        textarea,
        select.field {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7ddce;
            background: white;
            border-radius: 8px
        }

        textarea {
            resize: vertical;
            min-height: 115px
        }

        .ratingbuttons {
            display: flex;
            gap: 8px
        }

        .ratingbuttons button {
            font-size: 28px;
            background: white;
            color: #c7ccbf;
            border: 1px solid var(--line);
            border-radius: 8px;
            width: 54px;
            height: 48px
        }

        .ratingbuttons button.on {
            color: #bf8825;
            border-color: #bf8825;
            background: #fff9e8
        }

        .notice {
            font-size: 12px;
            line-height: 1.6;
            background: #edf1e4;
            padding: 13px;
            border-radius: 8px;
            margin: 18px 0
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--green);
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            z-index: 30;
            box-shadow: 0 8px 30px #0002
        }

        .empty {
            text-align: center;
            padding: 50px;
            grid-column: 1/-1
        }

        .feedbackscale {
            display: flex;
            gap: 8px
        }

        .feedbackscale label {
            margin: 0;
            flex: 1;
            text-align: center;
            background: white;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px
        }

        .feedbackscale input {
            accent-color: var(--green)
        }

        @media(max-width:850px) {
            h1 {
                font-size: 43px
            }

            .grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .hero {
                grid-template-columns: 1fr
            }

            .art {
                display: none
            }

            .profilegrid {
                grid-template-columns: 1fr
            }

            .nav {
                gap: 5px
            }

            .nav .pill {
                display: none
            }

            header {
                padding: 0 20px
            }

            .brand {
                font-size: 18px
            }

            .searchbar {
                flex-wrap: wrap
            }

            .searchbar input {
                flex-basis: 50%
            }
        }

        @media(max-width:560px) {
            header {
                height: auto;
                min-height: 86px;
                flex-wrap: wrap;
                justify-content: center;
                padding: 14px 12px
            }

            .nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px
            }

            .grid {
                grid-template-columns: 1fr
            }

            main {
                padding: 25px 18px
            }

            .nav button {
                font-size: 12px
            }

            .nav .btn {
                padding: 10px
            }

            .brand {
                font-size: 15px
            }

            .logo {
                width: 28px;
                height: 28px
            }

            .sectionhead {
                gap: 10px
            }

            .sectionhead h2 {
                font-size: 23px
            }

            .bottom {
                align-items: flex-start;
                flex-direction: column
            }

            .footer {
                gap: 15px
            }

            .searchbar select {
                max-width: 100%;
                flex: 1
            }

            .hero {
                padding: 10px 0 25px
            }
        }

        .traitgrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .traitbutton {
            background: white;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            color: var(--ink)
        }

        .traitbutton b {
            display: block;
            margin-bottom: 4px
        }

        .traitbutton span {
            font-size: 11px;
            color: var(--muted)
        }

        .traitbutton.roast.selected {
            background: #fff0e8;
            border-color: #bb6e47
        }

        .traitbutton.props.selected {
            background: #edf4d9;
            border-color: #6b8b33
        }

        .traitbutton.selected {
            box-shadow: inset 0 0 0 1px currentColor
        }

        .chip.roast {
            background: #fff0e8;
            color: #955130
        }

        .chip.props {
            background: #edf4d9;
            color: #466522
        }

        .awardhero {
            background: #172e22;
            color: #f1f5e9;
            padding: 24px;
            border-radius: 13px;
            margin-top: 18px;
            position: relative;
            overflow: hidden
        }

        .awardhero h3 {
            font-size: 25px;
            letter-spacing: -.6px
        }

        .awardhero p {
            font-size: 13px;
            opacity: .75;
            margin-bottom: 0
        }

        .awardhero .eyebrow {
            color: #d3ef86
        }

        .awardhero .bigicon {
            font-size: 38px;
            float: right;
            margin-left: 12px
        }

        .awardtile {
            text-align: center;
            border: 2px solid #263c29;
            box-shadow: 6px 6px 0 #d3ef86
        }

        .awardtile .bigicon {
            font-size: 46px;
            margin: 12px
        }

        .awardtile p {
            min-height: 50px
        }

        .traitvotes {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 14px 0
        }

        .suggestions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .suggestions button {
            font-size: 11px;
            background: #ecefe5;
            border-radius: 7px;
            padding: 8px;
            color: var(--green)
        }

        .ceremonyhead {
            padding: 28px 0 35px
        }

        .ceremonyhead h1 {
            max-width: 800px
        }

        .modal {
            width: 660px
        }

        @media(max-width:420px) {
            .traitgrid {
                grid-template-columns: 1fr
            }
        }
    </style>

        /* Reference direction: lavender canvas, cobalt scores, gold stars, rounded white panels. */

                const { participation: p, communication: c, reliability: r, quality: q, collaboration: t } = values;

        function renderRating(index = activeMember) {
            activeMember = Math.max(0, Math.min(2, index)); activeTeamId = sliceTeam.id; history.replaceState(null, '', '#rate'); nav('rate'); const draft = draftFor(sliceTeam, ACTOR), r = draft[activeMember]; const done = [0, 1, 2].filter(i => RC.valid(draft[i])).length; app.innerHTML = `${header()}<div class="teammate-tabs" role="group" aria-label="Choose a teammate">${[0, 1, 2].map(i => `<button data-person="${i}" class="teammate-tab ${i === activeMember ? 'active' : ''}" ${i === activeMember ? 'aria-current="true"' : ''}><span class="tab-avatar" style="--avatar:${memberColors[i]}">${esc(initials(sliceTeam.members[i]))}</span><span>${esc(sliceTeam.members[i])}<small>${RC.valid(draft[i]) ? 'Review ready' : 'Teammate ' + (i + 1) + ' of 3'}</small></span><span class="tab-check">${RC.valid(draft[i]) ? '✓' : ''}</span></button>`).join('')}<span class="flow-completion" id="flowcompletion">${done}/3 reviews ready</span></div><div class="rating-layout"><section class="card rating-editor"><div class="memberheading"><div class="avatar" style="background:${memberColors[activeMember]}">${esc(initials(sliceTeam.members[activeMember]))}</div><div><div class="eyebrow">Rating your teammate</div><h2>${esc(sliceTeam.members[activeMember])}</h2><span class="mini muted">Group 16 · ${esc(sliceTeam.course)}</span></div></div><section class="overallpanel"><h3>Overall rating <span>Your call, 1–5 stars</span></h3><div class="starline"><div class="ratingbuttons" role="group" aria-label="Overall rating">${[1, 2, 3, 4, 5].map(v => `<button type="button" data-star="${v}" class="${v <= r.rating ? 'on' : ''}" aria-pressed="${v === r.rating}" aria-label="${v} out of 5 stars">${v <= r.rating ? '★' : '☆'}</button>`).join('')}</div><span class="ratinghint" id="ratinghint">${starHint(r.rating)}</span></div></section><div class="category-intro"><span class="eyebrow">A CLOSER LOOK</span><span>1 = needs improvement · 10 = exceptional</span></div>${RC.categories.map(c => `<section class="scorefield" aria-labelledby="label-${c.key}"><div class="scoretitle"><span id="label-${c.key}">${c.name}</span><output id="out-${c.key}">${r.scores[c.key] || '—'}<small>/ 10</small></output></div><p>${c.hint}</p><div class="scorechoices" role="group" aria-label="${c.name} score">${Array.from({ length: 10 }, (_, n) => n + 1).map(v => `<button type="button" data-score="${c.key}" data-value="${v}" class="${v === r.scores[c.key] ? 'selected' : v < r.scores[c.key] ? 'below' : ''}" aria-pressed="${v === r.scores[c.key]}" aria-label="${c.name}: ${v} out of 10">${v}</button>`).join('')}</div><div class="scalelabel"><span>1 · Room to grow</span><span>Above and beyond · 10</span></div></section>`).join('')}<section class="comment-section"><h3>A little context <span>Optional</span></h3><textarea id="reviewcomment" maxlength="700" aria-label="Optional feedback" placeholder="One thing ${esc(sliceTeam.members[activeMember])} did well, or could do differently…">${esc(r.text)}</textarea><div class="commentmeta"><span>Specific feedback goes a long way.</span><span id="charcount">${r.text.length}/700</span></div><label class="toggleline"><input id="anonymous" type="checkbox" role="switch" ${r.anonymous ? 'checked' : ''}><span>Make review anonymous<small>Your name is hidden in the review display.</small></span></label><label class="toggleline"><input id="publiccomment" type="checkbox" role="switch" ${r.publicComment ? 'checked' : ''}><span>Share this comment on their results<small>Off by default. Otherwise, keep it out of the results view.</small></span></label></section><p class="error" id="reviewerror" role="alert"></p><div class="editor-actions"><button class="textbtn" id="previousperson" ${activeMember === 0 ? 'disabled' : ''}>← Previous</button><button class="btn nextbutton" id="nextperson">${activeMember === 2 ? 'Reveal team awards ✦' : 'Next teammate →'}</button></div><div class="autosave"><span class="live-dot"></span>Saved as you go. Nothing is submitted until you reveal awards.</div></section><aside id="draftsummary" class="card live-result"></aside></div>${footer()}`;
            app.querySelectorAll('[data-person]').forEach(b => b.onclick = () => renderRating(+b.dataset.person)); app.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { r.rating = +b.dataset.star; app.querySelectorAll('[data-star]').forEach(x => { const on = +x.dataset.star <= r.rating; x.classList.toggle('on', on); x.textContent = on ? '★' : '☆'; x.setAttribute('aria-pressed', +x.dataset.star === r.rating) }); document.getElementById('ratinghint').textContent = starHint(r.rating); changed() }); app.querySelectorAll('[data-score]').forEach(b => b.onclick = () => { const key = b.dataset.score, value = +b.dataset.value; r.scores[key] = value; document.getElementById('out-' + key).innerHTML = value + '<small>/ 10</small>'; app.querySelectorAll('[data-score]').forEach(x => { if (x.dataset.score === key) { const v = +x.dataset.value; x.classList.toggle('selected', v === value); x.classList.toggle('below', v < value); x.setAttribute('aria-pressed', v === value) } }); changed() }); document.getElementById('reviewcomment').oninput = e => { r.text = e.target.value; document.getElementById('charcount').textContent = r.text.length + '/700'; changed() }; document.getElementById('anonymous').onchange = e => { r.anonymous = e.target.checked; changed() }; document.getElementById('publiccomment').onchange = e => { r.publicComment = e.target.checked; changed() }; document.getElementById('previousperson').onclick = () => { renderRating(activeMember - 1); window.scrollTo({ top: 0, behavior: 'smooth' }) }; document.getElementById('nextperson').onclick = () => { if (!RC.valid(r)) { document.getElementById('reviewerror').textContent = !r.rating ? 'Choose an overall star rating to continue.' : 'Choose a score in all five categories to continue.'; return } if (activeMember === 2) submitDirect(); else { renderRating(activeMember + 1); window.scrollTo({ top: 0, behavior: 'smooth' }) } }; updateDraftSummary(); persist()
        }
        function starHint(n) { return ['Your call', 'Needs work', 'Could be better', 'Solid', 'Great teammate', 'Above & beyond'][n] }
        function changed() { document.getElementById('reviewerror').textContent = ''; persist(); updateDraftSummary(); const draft = draftFor(sliceTeam, ACTOR), done = [0, 1, 2].filter(i => RC.valid(draft[i])).length; document.getElementById('flowcompletion').textContent = done + '/3 reviews ready'; app.querySelectorAll('[data-person]').forEach(b => { const yes = RC.valid(draft[+b.dataset.person]); b.querySelector('small').textContent = yes ? 'Review ready' : 'Teammate ' + (+b.dataset.person + 1) + ' of 3'; b.querySelector('.tab-check').textContent = yes ? '✓' : '' }) }
        function updateDraftSummary() { const s = preview(activeMember), a = recognition(s), m = medal(s), hasDraft = !!draftFor(sliceTeam, ACTOR)[activeMember].rating; document.getElementById('draftsummary').innerHTML = `<div class="result-title"><h2>${esc(sliceTeam.members[activeMember])}’s result</h2><span class="live-status"><i></i>Updates live</span></div><div class="result-section"><div class="eyebrow">Average rating</div><div class="average-line"><strong>${s.average === null ? '—' : s.average.toFixed(1)}</strong>${visualStars(s.average)}</div><span class="result-caption">${s.count} ratings · ${hasDraft ? 'including your current draft' : 'sample peer reviews'}</span></div><div class="result-section"><div class="eyebrow">Award</div><div class="recognition-row"><div class="award-seal ${a.tone}">${a.icon}</div><div><span class="award-trait">${esc(a.trait)}</span><h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p></div></div></div><div class="result-section last"><div class="eyebrow">Achievement</div><div class="recognition-row"><div class="medal-seal ${m.tone}">${m.symbol}</div><div><h3>${m.name}</h3><p>Your group project energy, certified</p></div></div></div><div class="preview-note">Includes two sample peer reviews.<br>Change any rating and watch the result react.</div><div class="result-draft-note">Live preview · Submit all three reviews to reveal the final team awards.</div>` }
        function submitDirect() { const draft = draftFor(sliceTeam, ACTOR), missing = [0, 1, 2].find(i => !RC.valid(draft[i])); if (missing !== undefined) { renderRating(missing); document.getElementById('reviewerror').textContent = 'Finish this teammate’s star rating and five category scores first.'; return } RC.submit(sliceTeam, ACTOR, draft); if (!persist()) return; history.replaceState(null, '', '#awards'); results(true); window.scrollTo({ top: 0, behavior: 'smooth' }) }
        function results(celebrate = false) { nav('awards'); const submitted = RC.submitted(sliceTeam, ACTOR); if (!submitted) { app.innerHTML = `<section class="awards-empty card"><div class="empty-award">✦</div><div class="eyebrow">A little suspense is a good thing.</div><h1>The awards are waiting.</h1><p>Give all three teammates their ratings.<br>Then come back for the reveal.</p><button class="btn" id="continue-rating">Continue rating →</button></section>${footer()}`; document.getElementById('continue-rating').onclick = () => { const d = draftFor(sliceTeam, ACTOR); renderRating([0, 1, 2].find(i => !RC.valid(d[i])) ?? 0) }; return } const data = [0, 1, 2].map(i => ({ index: i, name: sliceTeam.members[i], summary: RC.summary(RC.incoming(sliceTeam, i)) })); app.innerHTML = `<section class="awards-hero"><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div><div class="eyebrow">GROUP 16 · PROPS, ROASTS & PROJECT RECEIPTS</div><h1>The very unofficial<br><span>groupmate awards.</span></h1><p>The carries, the ghosts, and everyone who said “looks good guys.”</p><span class="ceremony-pill">✦ All 3 reviews submitted · Awards calculated automatically</span><span class="hero-spark spark-one">✧</span><span class="hero-spark spark-two">✦</span></section><div class="awards-sectionhead"><div><div class="eyebrow">THE TEAM’S MOMENT</div><h2>Credit where it’s due.</h2></div><button class="textbtn" id="editratings">Edit your ratings ↗</button></div><div class="ceremony-grid">${data.map(({ index: i, name, summary: s }) => { const a = recognition(s), m = medal(s); return `<article class="ceremony-card" style="--delay:${i * 100}ms;--member-color:${memberColors[i]}"><div class="ceremony-card-top"><span class="ceremony-avatar">${esc(initials(name))}</span><span class="tier-pill ${m.tone}">${m.symbol} ${m.name.replace(' Teammate', '')}</span></div><h2>${esc(name)}</h2><div class="ceremony-rating"><strong>${s.average.toFixed(1)}</strong><span>${visualStars(s.average)}<small>${s.count} teammate reviews</small></span></div><div class="ceremony-divider"></div><div class="eyebrow">EARNED AWARD</div><div class="ceremony-award"><span class="${a.tone}">${a.icon}</span><h3>${esc(a.title)}</h3></div><p>${esc(a.desc)}</p><span class="lore-trait">${esc(a.trait)}</span><div class="earned-badges">${s.awards.map(b => `<span>${b.icon} ${esc(b.name)}</span>`).join('')}</div><div class="ceremony-divider"></div><div class="eyebrow">TOP ACHIEVEMENT</div><div class="achievement-line"><span class="mini-medal ${m.tone}">${m.symbol}</span><span><b>${m.name}</b><small>${s.top ? esc(s.top.name) + ' · ' + s.top.value.toFixed(1) + '/10' : 'Keep growing together'}</small></span></div><button class="details-button" data-detail="${i}">See the full picture <span>↗</span></button></article>` }).join('')}</div><div class="closing-card"><span class="closing-star">✦</span><div><h3>The project is submitted. The lore is permanent.</h3><p>Give props to the carry. A title to the yapper. And everyone their flowers.</p></div><button class="btn" id="backtoratings">Back to ratings →</button></div>${footer()}${celebrate ? '<div class="confetti" aria-hidden="true">' + Array.from({ length: 18 }, (_, i) => `<i style="--x:${(i * 17) % 100}%;--r:${i * 41}deg;--d:${i % 5 * .09}s;--c:${['#ffd94b', '#8185ed', '#e5b7dd'][i % 3]}"></i>`).join('') + '</div>' : ''}`; document.getElementById('editratings').onclick = () => renderRating(0); document.getElementById('backtoratings').onclick = () => renderRating(0); app.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => showDetail(+b.dataset.detail)); document.getElementById('announcer').textContent = 'Reviews submitted. Team awards revealed.' }
        function showDetail(i) { const s = RC.summary(RC.incoming(sliceTeam, i)), a = recognition(s), mine = sliceTeam.reviews[ACTOR]?.[i]; modal(`<div class="eyebrow">THE FULL PICTURE</div><h2>${esc(sliceTeam.members[i])}’s project receipts</h2><div class="award-explainer"><b>${a.icon} ${esc(a.title)}</b><p>${esc(a.desc)}</p><small>Why this award: ${esc(a.rule)}</small></div><p class="muted">${s.count} received ratings · ${s.average.toFixed(1)} / 5 stars</p>${s.scores.map(c => `<div class="detail-score"><span>${c.name}</span><b>${c.value === null ? '—' : c.value.toFixed(1)} / 10</b><div class="progress-track"><i style="width:${(c.value || 0) * 10}%"></i></div></div>`).join('')}${mine?.text && mine.publicComment ? `<div class="shared-comment"><b>${mine.anonymous ? 'Anonymous teammate' : 'Your feedback'}</b><p>${esc(mine.text)}</p></div>` : '<p class="mini muted">No written comment shared on results.</p>'}<p class="mini muted">Category scores are shown as averages. Two reviews are sample data.</p>`) }
        function route() { closeModal(); if (location.hash === '#awards') results(); else renderRating(activeMember) }
        window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0) }); persist(); route();

    </script>
</body>
